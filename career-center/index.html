<style>
:root{--violet:#AD1D89;--bg:#FBF9FB;--surface:#fff;--ink:#1C1620;--muted:#5E5463;--line:#E6DEE5;--err:#B0173F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--violet:#E066BE;--bg:#141016;--surface:#1E1820;--ink:#F2ECF1;--muted:#B4A8B2;--line:#3A2F39;--err:#F27D9A}}
:root[data-theme="dark"]{--violet:#E066BE;--bg:#141016;--surface:#1E1820;--ink:#F2ECF1;--muted:#B4A8B2;--line:#3A2F39;--err:#F27D9A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--violet);border-radius:12px;padding:28px 24px;width:100%;max-width:24rem;display:grid;gap:14px}
h1{font-family:Georgia,serif;font-size:1.4rem;margin:0}
p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.5}
input{font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:700;padding:10px;border:0;border-radius:8px;background:var(--violet);color:#fff;cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid #00B8DE;outline-offset:2px}
.err{color:var(--err);font-size:.9rem;min-height:1.2em}
</style>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.trim().toUpperCase()),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
 return new TextDecoder().decode(pt);
}
async function go(pw,remember){
 try{const html=await open(pw);
  if(remember){try{localStorage.setItem("fp_pw",pw)}catch(e){}}
  document.open();document.write(html);document.close();return true;
 }catch(e){return false}
}
(async()=>{let s=null;try{s=localStorage.getItem("fp_pw")}catch(e){}
 if(s&&await go(s,false))return;})();
document.getElementById("f").onsubmit=async e=>{e.preventDefault();
 const ok=await go(document.getElementById("pw").value,true);
 if(!ok)document.getElementById("err").textContent="Mot de passe incorrect. / Wrong password.";};
</script>
