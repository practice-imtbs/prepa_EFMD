<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Faculty panel preparation for the EFMD visit of IMT Business School's PGE: ILOs, likely questions, sample answers, one page per faculty member. English / Français.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23AD1D89'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Georgia,serif' font-weight='700' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<title>Panel enseignant EFMD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
:root{
  --violet:#AD1D89; --violet-ink:#8A1670; --bleu:#007FA0; --bleu-vif:#00B8DE;
  --bg:#FBF9FB; --surface:#FFFFFF; --ink:#1C1620; --muted:#5E5463; --line:#E6DEE5; --tint:#F6EDF4; --tint-bleu:#E8F6FA;
  --ok:#2E7D4F; --warn:#9A5B00; --warn-bg:#FFF4E0; --on-violet:#fff;
  --i1:#007FA0; --i2:#AD1D89; --i3:#2E7D4F; --i4:#B5500F; --i5:#5B4BB7; --i6:#B0173F;
  --f-display:"Zilla Slab","Archer","Rockwell",Georgia,serif;
  --f-body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --violet:#E066BE; --violet-ink:#F08FD3; --bleu:#5FD0EC; --bleu-vif:#5FD0EC;
  --bg:#141016; --surface:#1E1820; --ink:#F2ECF1; --muted:#B4A8B2; --line:#3A2F39; --tint:#2A1D28; --tint-bleu:#14262C;
  --ok:#6FCF97; --warn:#F2B35B; --warn-bg:#2E2213; --on-violet:#141016;
  --i1:#5FD0EC; --i2:#E066BE; --i3:#6FCF97; --i4:#F2A15B; --i5:#A99BF2; --i6:#F27D9A; color-scheme:dark}}
:root[data-theme="dark"]{
  --violet:#E066BE; --violet-ink:#F08FD3; --bleu:#5FD0EC; --bleu-vif:#5FD0EC;
  --bg:#141016; --surface:#1E1820; --ink:#F2ECF1; --muted:#B4A8B2; --line:#3A2F39; --tint:#2A1D28; --tint-bleu:#14262C;
  --ok:#6FCF97; --warn:#F2B35B; --warn-bg:#2E2213; --on-violet:#141016;
  --i1:#5FD0EC; --i2:#E066BE; --i3:#6FCF97; --i4:#F2A15B; --i5:#A99BF2; --i6:#F27D9A; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:60rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--violet-ink)}

/* Bandeau */
header.band{background:#AD1D89;color:#fff}
header.band .wrap{padding-block:16px 26px;display:grid;gap:10px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;opacity:.92}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.7);border-radius:999px;overflow:hidden}
.lang button{font:inherit;font-size:.8rem;font-weight:700;letter-spacing:.05em;background:transparent;color:#fff;border:0;padding:5px 13px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:#8A1670}
.lang button:focus-visible{outline:3px solid #fff;outline-offset:-3px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,4.5vw,2.7rem);line-height:1.1;margin:0;text-wrap:balance}
.band p{margin:0;max-width:46rem;opacity:.96}
.crumb{font-size:.88rem}
.crumb a{color:#fff}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.cta{font:inherit;font-size:.95rem;font-weight:700;text-decoration:none;border-radius:8px;padding:9px 16px;cursor:pointer;border:2px solid #fff;display:inline-block}
.cta.solid{background:#fff;color:#8A1670}
.cta.line{background:transparent;color:#fff}
.cta:focus-visible{outline:3px solid var(--bleu-vif);outline-offset:2px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px}
.hero-meta .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.6);color:#fff}

/* Navigation */
nav.main{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.main .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:thin;align-items:center}
.tab{flex:0 0 auto;font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.tab:hover{border-color:var(--violet)}
.tab[aria-current="page"]{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
.tab.sm{font-size:.82rem;padding:4px 11px;background:transparent}
.sep{flex:0 0 1px;align-self:stretch;background:var(--line);margin:2px 6px}
.tab:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--bleu-vif);outline-offset:2px}
section[id]{scroll-margin-top:70px}

/* Contenu */
main .wrap{padding-block:28px 64px;display:grid;gap:44px}
section{display:grid;gap:14px;min-width:0}
h2{font-family:var(--f-display);font-weight:600;font-size:1.6rem;line-height:1.2;margin:0;color:var(--violet-ink);text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.18rem;margin:0;text-wrap:balance}
p{margin:0;max-width:65ch}
.lead{font-size:1.08rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.say{border-left:3px solid var(--bleu);background:var(--tint-bleu);padding:12px 16px;border-radius:0 var(--r) var(--r) 0;display:grid;gap:6px}
.say .lbl,.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--bleu);font-weight:700}
.say p{font-style:italic}
.todo{background:var(--warn-bg);border:1px dashed var(--warn);color:var(--ink);padding:10px 14px;border-radius:var(--r);font-size:.92rem}
.todo b{color:var(--warn)}
body:not(.team) .int{display:none!important}
body.team .ext{display:none!important}
.ilos{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:12px}
.ilo{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start}
.ilo .num{font-family:var(--f-display);font-weight:700;color:var(--c);font-size:1.05rem}
.ilo .name{font-weight:700}
.ilo .can{background:color-mix(in srgb,var(--c) 9%,var(--surface));border-left:3px solid var(--c);border-radius:6px;padding:8px 10px;font-size:.93rem}
.ilo .can b{display:block;font-size:.76rem;color:var(--c);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.ilo .def{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.course .can{font-size:.88rem;color:var(--muted);margin:2px 0 0}
.ilo .fr{font-size:.92rem}
.ilo .en{font-size:.88rem}
.ilo .en.sub{color:var(--muted);font-style:italic;font-size:.86rem}
.ilo .key{font-size:.8rem;color:var(--c);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--tint);font-weight:700}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip.v{border-color:var(--c,var(--violet));color:var(--c,var(--violet-ink))}
.chip.v.sec{font-weight:600;border-style:dashed}
.chip.s{color:var(--muted)}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.node{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.9rem;min-width:0}
.node b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.arrow{color:var(--violet);font-weight:700}
.loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:8px;counter-reset:s}
.loop div{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--violet);border-radius:8px;padding:10px 12px;font-size:.9rem;counter-increment:s}
.loop div::before{content:counter(s);font-family:var(--f-display);font-weight:700;color:var(--violet);margin-right:6px}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:2.2rem 1fr;gap:12px;align-items:start}
.step .n{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--violet);line-height:1}
.step .body{display:grid;gap:6px;min-width:0;border-bottom:1px solid var(--line);padding-bottom:12px}
.step .chez{font-size:.92rem}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details>summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";color:var(--violet);font-weight:700}
details[open]>summary::after{content:"−"}
details .inner{padding:0 16px 14px;display:grid;gap:10px}
.qa summary .q{font-weight:700}
.qa summary .qfr{display:block;font-weight:400;font-size:.86rem;color:var(--muted)}
ul.clean{margin:0;padding-left:1.1rem;display:grid;gap:4px;max-width:65ch}
.qlist{display:grid;gap:8px}
.drill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.drill .cardq{font-family:var(--f-display);font-size:1.25rem;font-weight:600;min-height:3.2em}
.drill .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.btn{font:inherit;font-size:.9rem;border-radius:8px;border:1px solid var(--violet);background:var(--violet);color:var(--on-violet);padding:7px 14px;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--violet-ink)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}

/* Choix de l'enseignant */
.finder{display:grid;gap:10px}
.finder input[type=search]{font:inherit;width:100%;max-width:26rem;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.grp{display:grid;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:12px}
.pcard{display:grid;grid-template-columns:3rem 1fr;gap:12px;align-items:start;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--violet);transform:translateY(-2px)}
.avatar{width:3rem;height:3rem;border-radius:50%;background:var(--violet);color:var(--on-violet);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.pcard .nm{font-family:var(--f-display);font-weight:600;font-size:1.12rem;line-height:1.2}
.pcard .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cta-box{background:var(--tint);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.cta-box h3{margin-bottom:2px}
.cta-box .cta{background:var(--violet);color:var(--on-violet);border-color:var(--violet)}

/* Page enseignant */
.prof-head{display:grid;gap:6px}
.prof-head .meta{display:flex;flex-wrap:wrap;gap:6px}
.jump{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}
.jump select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.14);color:#fff}
.jump select option{color:#1C1620;background:#fff}
.course-list{display:grid;gap:12px}
.course{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--violet));border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;min-width:0}
.course .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.course .code{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:.85rem}
.course .title{font-weight:700}
.course dl{display:grid;grid-template-columns:8.5rem 1fr;gap:4px 12px;margin:0;font-size:.9rem}
.course dt{color:var(--muted)}
.course dd{margin:0;min-width:0}
@media (max-width:520px){.course dl{grid-template-columns:1fr}.course dt{margin-top:6px}}
.figs{display:flex;flex-wrap:wrap;gap:6px 14px;font-variant-numeric:tabular-nums;font-size:.88rem}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager a{display:block;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;color:var(--ink);min-width:12rem}
.pager a:hover{border-color:var(--violet)}
.pager small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.07em}
.pager .next{text-align:right;margin-left:auto}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
footer .wrap{padding-block:18px 28px;display:grid;gap:6px}
footer label{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.skip{position:absolute;left:-999px;top:0;background:var(--surface);color:var(--ink);padding:8px 14px;z-index:20;border-radius:0 0 8px 0}
.skip:focus{left:0}
.back{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;z-index:6;opacity:0;pointer-events:none;transition:opacity .2s;font:inherit;font-size:.85rem;border:1px solid var(--violet);background:var(--surface);color:var(--violet-ink);border-radius:999px;padding:6px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.back.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@media print{
  nav.main,.back,.skip,#drill-show,#drill-next,.lang,.hero-cta,.jump,.pager,.cta-box{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  header.band{background:#fff;color:#AD1D89;border-bottom:2px solid #AD1D89}
  header.band .wrap,.band p,.crumb a{color:#AD1D89}
  details>*{display:block!important}
  details>summary::after{content:""}
  section,.box,.course,.ilo,details{break-inside:avoid}
}
</style>
</head>
<body>
<a class="skip" href="#contenu" id="skip">Skip to content</a>

<header class="band">
  <div class="wrap">
    <div class="topline">
      <div class="eyebrow" id="brand"></div>
      <div class="lang" role="group" aria-label="Language / Langue">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      </div>
    </div>
    <div id="hero"></div>
  </div>
</header>

<nav class="main" id="nav" aria-label="Main"></nav>

<main id="contenu" tabindex="-1"><div class="wrap" id="app"></div></main>

<footer><div class="wrap">
  <span id="foot1"></span>
  <span id="foot2"></span>
</div></footer>

<button class="back" id="back" type="button"></button>

<script>
/* ====== Outils de langue ====== */
const L=(f,e)=>[f,e];
let lang="en";const team=false;
try{lang=localStorage.getItem("panel-lang")||"en"}catch(e){}
if(/[?&]lang=(fr|en)/.test(location.search))lang=RegExp.$1;

/* Typographie française : espaces insécables avant : ; ? ! % » et après « */
const frTypo=s=>s.replace(/ ([:;?!%»])/g," $1").replace(/« /g,"« ").replace(/\b(ILO|Groupe|Question|FIN|MIS|INF|MKT|ACC|RES|STR|MAN|ECO|QUA) (\d)/g,"$1 $2").replace(/(\d) (h\b)/g,"$1 $2");
const t=x=>{const s=typeof x==="string"?x:x[lang==="fr"?0:1];return lang==="fr"?frTypo(s):s};
const $=s=>document.querySelector(s);
const num=(n,d)=>{const s=d===undefined?String(n):Number(n).toFixed(d);return lang==="fr"?s.replace(".",","):s};
const pct=(n,d)=>lang==="fr"?num(n,d)+"\u00A0%":num(n,d)+"%";

/* ====== Textes de l'interface ====== */
const U={
 brand:L("IMT Business School · Accréditation EFMD du PGE (IMM)","IMT Business School · EFMD accreditation of the PGE (IMM)"),
 skip:L("Aller au contenu","Skip to content"),
 navGen:L("Général","General"),navPage:L("Votre page","Your page"),
 up:L("↑ Haut","↑ Top"),
 foot1:L("Service PracTice · IMT Business School · version de travail du 16/10/2026, document interne.","PracTice service · IMT Business School · working version of 16/10/2026, internal document."),
 foot2:L("Sources : datasheet EFMD, programmes de visite du 13/10/2026, catalogue PGE 2025-2026, correspondance blocs et ILO, tableau ILO Achievement 2025-26, note de clarification des ILOs de la direction académique (16/10/2026).","Sources: EFMD datasheet, visit schedules of 13/10/2026, 2025-2026 PGE catalogue, block-to-ILO mapping, ILO Achievement 2025-26 table, ILO clarification note from academic management (16/10/2026)."),

 homeTitle:L("Préparer le panel enseignant","Getting Ready for the EFMD Faculty Panel"),
 homeLead:L("Audit blanc le jeudi 26 novembre, visite des auditeurs le jeudi 3 décembre 2026. Ce que chacun·e doit savoir dire, en français pour comprendre et en anglais pour répondre.","Mock review on Thursday 26 November, peer review visit on Thursday 3 December 2026. What every faculty member should be able to say, in English, when the reviewers ask."),
 ctaFind:L("Trouver ma page personnelle →","Find my personal page →"),
 ctaRead:L("Lire les principes généraux ↓","Read the general principles ↓"),
 anchors:[["sec-dates",L("Dates","Dates")],["ilos",L("Les six ILOs","Six ILOs")],["blocs",L("ILOs et blocs","ILOs and blocks")],["construction",L("Construction","How built")],["boucle",L("Boucle d'amélioration","Improvement loop")],["incontournables",L("Questions clés","Key questions")],["entrainement",L("S'entraîner","Practise")],["banque",L("Banque de questions","Question bank")],["regles",L("Règles du jour J","Day-one rules")]],
 sayLbl:L("À dire en anglais","Sample answer"),
 outline:L("Trame","Outline"),exAnswer:L("Exemple de réponse","Example answer"),
 // Accueil
 s1Title:L("Ce que les auditeurs viennent vérifier","What the reviewers come to check"),
 s1p1:L("Pendant environ une heure, quatre auditeurs interrogent un groupe d'enseignant·es. Ils écoutent moins le contenu des cours que la façon dont vous parlez de la démarche : la connaissez-vous, y avez-vous participé, l'utilisez-vous pour faire évoluer vos cours ?","For about an hour, four peer reviewers will question a group of faculty members. They care less about the content of your courses than about how you talk about the quality approach: do you know it, did you take part in it, do you use it to improve your courses?"),
 s1p2:L("Ils cherchent un signal faible. Une école où la démarche qualité est portée par la direction seule (« faites vos cours, on s'occupe du dossier ») ne passe pas. Ils veulent voir une organisation qui apprend : chacun·e connaît les six ILOs, sait où se place son cours et peut donner un exemple d'amélioration. Personne ne doit découvrir ces notions le jour J.","They look for weak signals. A school where quality is carried by management alone (“teach your courses, we'll take care of the file”) does not pass. They want to see a learning organisation: everyone knows the six ILOs, knows where their course fits and can give an example of an improvement. Nobody should discover these notions on the day."),
 mockLbl:L("Audit blanc","Mock review"),
 mockT:L("Jeudi 26 novembre 2026, 13h15 à 14h30","Thursday 26 November 2026, 1:15 pm to 2:30 pm"),
 mockP:L("Un seul groupe, avec Björn Kjellander (Jönköping University). Répétition générale, en anglais.","A single group, with Björn Kjellander (Jönköping University). Dress rehearsal, in English."),
 prvLbl:L("Visite EFMD (Peer Review Visit)","EFMD visit (Peer Review Visit)"),
 prvT:L("Jeudi 3 décembre 2026, 14h45 à 16h00","Thursday 3 December 2026, 2:45 pm to 4:00 pm"),
 prvP:L("Deux groupes de 4 à 5 personnes. Présidente : Julie Perrin-Halot (GEM). Avec Thomas Cleff (Pforzheim), Shirley Rate (Glasgow Caledonian) et Burcu Vural (British Council).","Two groups of 4 to 5 people. Chair: Julie Perrin-Halot (GEM). With Thomas Cleff (Pforzheim), Shirley Rate (Glasgow Caledonian) and Burcu Vural (British Council)."),
 s2Title:L("Les six ILOs, à connaître par cœur","The six ILOs: know them by heart"),
 s2p:L("Un ILO (<em>Intended Learning Outcome</em>) décrit ce qu'un·e diplômé·e du programme sait faire <strong>à la fin du programme</strong>, en connaissances, savoir-faire et attitudes. Il y en a six. Ils s'appliquent à partir de 2026-27. Retenez au moins le mot-clé de chacun.","An ILO (<em>Intended Learning Outcome</em>) describes what a graduate of the programme can do <strong>at the end of the programme</strong>, in terms of knowledge, skills and attitudes. There are six. They apply from 2026-27. Remember at least the keyword of each one."),
 s2say:L("“Our programme has six intended learning outcomes. By the end of the IMM, our graduates are able to use digital technologies and data responsibly, think critically and innovate, create sustainable value, lead transformation projects, communicate in multicultural settings and lead responsibly.”","“Our programme has six intended learning outcomes. By the end of the IMM, our graduates are able to use digital technologies and data responsibly, think critically and innovate, create sustainable value, lead transformation projects, communicate in multicultural settings and lead responsibly.”"),
 s2canQ:L("La question simple à garder en tête : <strong>qu'est-ce qu'un·e étudiant·e doit être capable de faire ?</strong> Sous chaque ILO, la phrase « Concrètement » dit ce que cela signifie pour vous, enseignant·e. Le libellé officiel (celui du dossier EFMD) vient juste après.","The simple question to keep in mind: <strong>what must a student be able to do?</strong> Under each ILO, the “In practice” sentence says what it means for you as a teacher. The official wording (the one in the EFMD file) follows right after."),
 canLbl:L("Concrètement","In practice"),
 defLbl:L("Libellé officiel","Official wording"),
 courseCan:L("Pour votre cours","For your course"),
 s2goodT:L("Un ILO décrit un résultat, pas un moyen","An ILO describes a result, not a means"),
 s2goodP:L("La question des auditeurs n'est pas « Qu'enseignez-vous ? » mais « Que pouvez-vous démontrer que vos diplômé·es savent faire ? ». Un ILO est donc orienté apprenant : il est observable, mesurable et évaluable. Il commence par un verbe d'action de la taxonomie de Bloom (appliquer, analyser, évaluer, concevoir…) et vise un niveau master : analyse, prise de décision, esprit critique, leadership, gestion de la complexité.","The reviewers' question is not “What do you teach?” but “What can you show that your graduates are able to do?”. An ILO is therefore learner-centred: observable, measurable and assessable. It starts with an action verb from Bloom's taxonomy (apply, analyse, evaluate, design…) and targets master's level: analysis, decision-making, critical thinking, leadership, handling complexity."),
 meansLbl:L("Formulé en moyens, à éviter","Phrased as a means: avoid"),
 meansP:L("« Le programme apporte des connaissances en finance. »<br>« Comprendre le marketing digital. »","“The programme provides knowledge in finance.”<br>“Understand digital marketing.”"),
 resLbl:L("Formulé en résultat, attendu","Phrased as a result: expected"),
 resP:L("« Les diplômé·es sont capables d'analyser la performance financière d'une organisation et de formuler des recommandations. »<br>« Concevoir et justifier une stratégie de marketing digital intégrée à partir d'une analyse de données de marché. »","“Graduates are able to analyse an organisation's financial performance and make recommendations.”<br>“Design and justify an integrated digital marketing strategy based on an analysis of market data.”"),
 s3Title:L("ILOs et blocs de compétences : deux grilles, un même diplôme","ILOs and competency blocks: two frameworks, one degree"),

 s3p2:L("La correspondance n'est pas une équivalence un pour un. Un même bloc peut nourrir plusieurs ILOs, et chaque cours a un ILO principal, parfois un ILO secondaire. Le tableau de correspondance (blocs, MAC, cours, ILO) a été établi à partir des syllabus 2025-26 : c'est lui qui dit dans quel ILO s'inscrit votre cours. Votre page personnelle en reprend les lignes qui vous concernent.","The mapping is not one-to-one. A single block can feed several ILOs, and each course has a main ILO and sometimes a secondary one. The mapping table (blocks, MACs, courses, ILOs) was built from the 2025-26 syllabi: it tells you which ILO your course belongs to. Your personal page lists the lines that concern you."),
 s3say:L("“The competency blocks come from our national certification framework, the RNCP. The ILOs are our programme-level outcomes for EFMD. We mapped every course to the blocks and to the ILOs, so each syllabus shows which ILO the course mainly contributes to.”","“The competency blocks come from our national certification framework, the RNCP. The ILOs are our programme-level outcomes for EFMD. We mapped every course to the blocks and to the ILOs, so each syllabus shows which ILO the course mainly contributes to.”"),
 s4Title:L("Comment les ILOs ont été construits","How the ILOs were built"),
 s4p:L("C'est la question qui teste le plus l'implication des enseignant·es : « Comment avez-vous été associé·e ? ». La mauvaise réponse : « c'est l'équipe programme ». La bonne : « les ILOs ont été construits en consultant régulièrement l'ensemble des parties prenantes ». Voici la démarche attendue par l'EFMD, étape par étape, et ce qui s'est fait chez nous à chaque étape.","This is the question that tests faculty involvement the most: “How were you involved?” The wrong answer: “the programme team did it”. The right one: “the ILOs were built through regular consultation of all stakeholders”. Here is the approach EFMD expects, step by step, and what happened here at each step."),

 here:L("Chez nous :","Here:"),
 s4say:L("“We were involved from the start. The competency approach was presented in our department meetings, we rewrote our syllabi with the support of the pedagogical team, and each course is now linked to the competencies and to an ILO. The results are discussed in the Assurance of Learning Committee, and we get them back to adjust our courses.”","“We were involved from the start. The competency approach was presented in our department meetings, we rewrote our syllabi with the support of the pedagogical team, and each course is now linked to the competencies and to an ILO. The results are discussed in the Assurance of Learning Committee, and we get them back to adjust our courses.”"),
 s5Title:L("La boucle d'amélioration continue","The continuous improvement loop"),
 s5p:L("Les auditeurs veulent que la boucle soit connue des enseignant·es, et pas seulement écrite dans le rapport. Elle a cinq temps :","The reviewers want the loop to be known by faculty, not just written in the report. It has five stages:"),
 loop:[L("Définir l'ILO et la preuve qui le mesure","Define the ILO and the evidence that measures it"),L("Mesurer dans les cours rattachés","Measure in the mapped courses"),L("Analyser les résultats en comité AoL","Analyse the results in the AoL committee"),L("Améliorer le cours ou l'évaluation","Improve the course or its assessment"),L("Mesurer à nouveau l'année suivante","Measure again the following year")],
 s5p2:L("<strong>Note du cours et atteinte d'un ILO, ce n'est pas la même chose.</strong> La note dit si un·e étudiant·e a validé votre cours. L'ILO se mesure sur l'ensemble de la cohorte, à partir de plusieurs cours : un ILO peut reposer sur 15 ou 20 modules. Votre rôle : évaluer de façon cohérente avec l'ILO de votre cours, faire des retours aux étudiant·es, puis regarder vos résultats (notes, répartition, évaluations du cours) pour ajuster votre façon d'enseigner.","<strong>A course grade and ILO attainment are not the same thing.</strong> The grade says whether a student passed your course. An ILO is measured across the whole cohort, from several courses: one ILO can rest on 15 or 20 modules. Your role: assess consistently with your course's ILO, give students feedback, then look at your results (grades, distribution, course evaluations) to adjust how you teach."),
 proofH:L("Ce qui prouve qu'un ILO est acquis","What proves an ILO is achieved"),
 proofP:L("Un ILO n'existe vraiment que s'il est mesuré. Il faut quatre éléments : une évaluation qui le cible, une grille (rubric) avec des critères, un niveau attendu, et un indicateur de réussite pour la cohorte. Par exemple, pour « prendre des décisions fondées sur des données » : une étude de cas de Business Analytics, une grille sur la qualité de l'analyse, l'interprétation et la pertinence des recommandations, un niveau attendu de 75 %, et un objectif de 85 % des étudiant·es à ce niveau. On distingue les <strong>mesures directes</strong> (cas intégrateurs, business games, mémoire, stage) des <strong>mesures indirectes</strong> (enquêtes étudiant·es et alumni, retours des entreprises).","An ILO only really exists if it is measured. Four elements are needed: an assessment that targets it, a rubric with criteria, an expected level, and a success indicator for the cohort. For instance, for “make data-driven decisions”: a Business Analytics case study, a rubric on quality of analysis, interpretation and relevance of recommendations, an expected level of 75%, and a target of 85% of students reaching it. <strong>Direct measures</strong> (capstone cases, business games, thesis, internship) are distinguished from <strong>indirect measures</strong> (student and alumni surveys, employer feedback)."),
 caseH:L("Raconter une boucle complète : la structure attendue","Telling a complete loop: the expected structure"),
 caseP:L("Une question revient souvent : « Pouvez-vous me montrer un exemple où la mesure d'un ILO a conduit à modifier le programme ? ». Voici la structure d'une bonne réponse, sur un exemple type (fictif) à transposer à votre cours ou à votre majeure.","A question often comes up: “Can you show me an example where measuring an ILO led to a change in the programme?”. Here is the structure of a good answer, on a model (fictitious) example to transpose to your own course or major."),

 thMod:L("Modules","Modules"),thGr:L("Notes","Grades"),thPass:L("Réussite","Pass rate"),thTarget:L("Cible atteinte","Target met"),yes:L("Oui","Yes"),narrow:L("base étroite","narrow base"),
 s5p3:L("Les six ILOs sont atteints, mais ce seuil se confond avec la simple réussite aux modules. L'équipe AoL propose d'ajouter un niveau attendu (12/20 ou « Meets expectations » sur une grille) à partir de 2026-27, pour faire apparaître de vrais écarts à travailler. Si on vous interroge sur les chiffres, dites que la mesure s'affine, c'est un signe de maturité.","All six ILOs are met, but this threshold is hard to tell apart from simply passing modules. The AoL team proposes adding an expected level (12/20 or “Meets expectations” on a rubric) from 2026-27, to reveal real gaps to work on. If asked about the figures, say that measurement is being refined, which is a sign of maturity."),
 s5ex:L("Des exemples concrets à citer","Concrete examples to quote"),

const ILOS=[
 {n:1,key:"Data",name:"Digital & Data Intelligence",can:L("L'étudiant·e sait mobiliser les outils numériques et les données pour analyser une situation, éclairer une décision ou résoudre un problème de management.","The student can use digital tools and data to analyse a situation, inform a decision or solve a management problem."),fr:"Choisir, mobiliser et évaluer de façon critique le numérique, les données et l'IA pour résoudre des problèmes de management, en mesurant leurs effets organisationnels, éthiques et sociétaux.",en:"Select, mobilise and critically evaluate digital technologies, data and AI-enabled tools to address complex managerial problems, while assessing their organisational, ethical and societal implications."},
 {n:2,key:"Think",name:"Critical Thinking, Analysis & Innovation",can:L("L'étudiant·e sait analyser un problème, questionner les hypothèses, construire un raisonnement et proposer des solutions pertinentes ou nouvelles.","The student can analyse a problem, question assumptions, build an argument and propose relevant or new solutions."),fr:"Analyser des situations complexes, évaluer les preuves et les points de vue, et formuler des recommandations innovantes et fondées, avec des méthodes d'analyse et de recherche adaptées.",en:"Analyse complex managerial situations, evaluate evidence and alternative perspectives, and formulate innovative, well-founded recommendations using appropriate analytical and research methods."},

 {n:4,key:"Transform",name:"Transformation, Project & Change Leadership",can:L("L'étudiant·e sait concevoir et conduire un projet ou une transformation, organiser l'action et accompagner le changement.","The student can design and lead a project or a transformation, organise action and support change."),fr:"Concevoir et conduire des projets de transformation complexes en intégrant les dimensions stratégiques, technologiques, organisationnelles et humaines. C'est l'ILO qui porte le profil manager-ingénieur.",en:"Design and contribute to the implementation of complex organisational transformation projects by integrating strategic, technological, organisational and human dimensions and coordinating diverse stakeholders."},

 {n:6,key:"Lead",name:"Responsible Leadership & Professional Development",can:L("L'étudiant·e sait prendre du recul sur sa posture, agir de manière responsable et développer ses compétences professionnelles et son leadership.","The student can step back from their own stance, act responsibly and develop their professional skills and leadership."),fr:"Exercer un leadership éthique, inclusif et responsable, un jugement professionnel solide, et continuer à se développer face aux évolutions professionnelles, sociétales et technologiques.",en:"Demonstrate ethical, inclusive and responsible leadership, exercise sound professional judgement, and continuously develop their capabilities in response to changing professional, societal and technological environments."}

 {t:L("Consulter les parties prenantes","Consult stakeholders"),g:L("En interne : la direction de la formation (alignement stratégique), la direction du PGE (cohérence pédagogique), les enseignant·es (traduction en cours), la qualité (mesure) et les étudiant·es (expérience d'apprentissage). En externe : les entreprises partenaires (compétences attendues, évolution des métiers), les alumni (« quelles compétences du PGE vous servent le plus aujourd'hui ? ») et les recruteurs (adéquation à l'emploi).","Internally: academic management (strategic alignment), the PGE director (pedagogical coherence), faculty (turning ILOs into courses), the quality team (measurement) and students (learning experience). Externally: partner companies (expected skills, changing jobs), alumni (“which PGE skills are most useful to you today?”) and recruiters (fit with employability)."),c:L("Advisory Board (deux fois par an), Corporate Steering Committees de chaque majeure (une fois par an), International Advisory Board.","Advisory Board (twice a year), Corporate Steering Committees for each major (once a year), International Advisory Board."),todo:null},

 {t:L("Cartographier les cours","Map the courses"),g:L("Chaque cours est rattaché aux ILOs dans une matrice (curriculum map). Les auditeurs y cherchent une progression : l'ILO est d'abord introduit (<em>Introduce</em>), puis consolidé (<em>Consolidate</em>), enfin démontré (<em>Demonstrate</em>) dans les cours de fin de cursus.","Each course is linked to the ILOs in a matrix (curriculum map). Reviewers look for a progression: the ILO is first introduced, then consolidated, and finally demonstrated in end-of-programme courses."),c:L("Tableau de correspondance blocs RNCP, MAC, cours et ILO, avec un ILO principal et parfois un ILO secondaire par cours.","Mapping table of RNCP blocks, MACs, courses and ILOs, with a main ILO and sometimes a secondary ILO per course."),todo:null},

const chipIlo=(n,sec)=>`<span class="chip v${sec?" sec":""}" style="--c:var(--i${n})">ILO ${n} ${sec?t(U.secondary):t(U.main)}</span>`;
const chipKey=n=>`<span class="chip v" style="--c:var(--i${n})">ILO ${n} · ${ILOS[n-1].key}</span>`;
const say=(txt,lbl)=>`<div class="say"><div class="lbl">${t(lbl||U.sayLbl)}</div><p lang="en">${txt}</p></div>`;
const todo=txt=>`<div class="todo int">${t(txt)}</div>`;

function groupedProfs(){
  return [["g1",PROFS.filter(p=>p.grp==="g1")],["g2",PROFS.filter(p=>p.grp==="g2")],["tbc",PROFS.filter(p=>p.grp==="tbc")]].filter(g=>g[1].length);

function cardsHtml(q){
  const f=(q||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const out=groupedProfs().map(([g,list])=>{
    const l=list.filter(p=>!f||p.name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").includes(f));
    if(!l.length)return"";
    return `<div class="grp"><h3>${t(U.grpLbl[g])}</h3><div class="cards">${l.map(p=>{
      const ilos=[...new Set(p.courses.flatMap(c=>c.ilo))].sort();
      return `<a class="pcard" href="#/t/${p.id}"><div class="avatar" aria-hidden="true">${initials(p.name)}</div><div><div class="nm">${p.name}</div><div class="small muted">${[p.title,p.dept].filter(Boolean).join(" · ")} · ${t(U.nCourses(p.courses.length))}</div><div class="meta">${ilos.map(n=>`<span class="chip v" style="--c:var(--i${n})">ILO ${n}</span>`).join("")}</div></div></a>`}).join("")}</div></div>`;
  }).join("");
  return out||`<p class="muted">${t(U.none)}</p>`;
}

  <div class="two"><div class="box"><h3>${t(U.strengthsT)}</h3><ul class="clean">${p.points.map(x=>`<li>${t(x)}</li>`).join("")}</ul></div></div>
  <section><h3>${t(U.prepT)}</h3><div class="qlist">${[CORE[0],CORE[3],CORE[4]].map(c=>qaBlock(c,U.outline)).join("")}</div><p class="small">${t(U.prepNote)}</p></section>
  <nav class="pager" aria-label="${t(U.allTeachers)}"><a href="#/t/${PROFS[prevI].id}"><small>← ${t(U.prev)}</small>${PROFS[prevI].name}</a><a class="next" href="#/t/${PROFS[nextI].id}"><small>${t(U.next)} →</small>${PROFS[nextI].name}</a></nav>`;
}
function heroProf(p){
  const ilos=[...new Set(p.courses.flatMap(c=>c.ilo))].sort();
  return `<div class="crumb"><a href="#/panel">${t(U.allTeachers)}</a></div>
   <div class="lbl" style="color:#fff;opacity:.9">${t(U.grpLbl[p.grp])}</div>
   <h1>${p.name}</h1>
   <div class="hero-meta">${p.title?`<span class="chip">${p.title}</span>`:""}${p.dept?`<span class="chip">${t(U.dept)} ${p.dept}</span>`:""}${ilos.map(n=>`<span class="chip">ILO ${n} · ${ILOS[n-1].key}</span>`).join("")}</div>
   <div class="jump"><label for="jump">${t(U.switchTo)}</label><select id="jump">${PROFS.map(x=>`<option value="${x.id}"${x.id===p.id?" selected":""}>${x.name}</option>`).join("")}</select></div>`;
}

/* Navigation */
let cur=location.hash;
function go(h){cur=h;try{history.replaceState(null,"",h)}catch(e){}render(false)}
function route(){
  const h=cur.replace(/^#\/?/,"");
  if(h==="panel")return{k:"panel"};
  const m=h.match(/^t\/([\w-]+)/);
  if(m){const p=PROFS.find(x=>x.id===m[1]);if(p)return{k:"prof",p}}
  return{k:"home"};
}
let lastKey=null;
function render(first){
  const r=route();
  document.documentElement.lang=lang;
  $("#brand").textContent=t(U.brand);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false"));
  $("#skip").textContent=t(U.skip);$("#back").textContent=t(U.up);$("#back").setAttribute("aria-label",lang==="fr"?"Retour en haut de la page":"Back to top");
  $("#foot1").textContent=t(U.foot1);$("#foot2").textContent=t(U.foot2);document.body.classList.remove("team");

  let hero,view,title;
  if(r.k==="home"){hero=heroHome();view=viewHome();title=t(U.homeTitle)}
  else if(r.k==="panel"){hero=heroPanel();view=viewPanel();title=t(U.findTitle)}
  else{hero=heroProf(r.p);view=viewProf(r.p);title=r.p.name}
  $("#hero").innerHTML=hero;$("#app").innerHTML=view;
  document.title=title+" · EFMD";

  $("#nav").innerHTML=`<div class="wrap"><a class="tab" href="#/" ${r.k==="home"?'aria-current="page"':""}>${t(U.navGen)}</a><a class="tab" href="#/panel" ${r.k!=="home"?'aria-current="page"':""}>${t(U.navPage)}${r.k==="prof"?" · "+r.p.name:""}</a>${r.k==="home"?`<span class="sep" aria-hidden="true"></span>${U.anchors.map(a=>`<button class="tab sm" type="button" data-scroll="${a[0]}">${t(a[1])}</button>`).join("")}`:""}</div>`;

  if(r.k==="home")initDrill();
  if(r.k==="panel"){$("#finder-q").addEventListener("input",e=>{$("#finder-out").innerHTML=cardsHtml(e.target.value)})}
  if(r.k==="prof"){$("#jump").addEventListener("change",e=>go("#/t/"+e.target.value))}
  const key=r.k+(r.p?r.p.id:"");
  if(!first&&key!==lastKey)scrollTo({top:0,behavior:"instant"});
  lastKey=key;
}

/* Entraînement */
let order=[],pos=0,POOL=[];
function shuffle(){order=POOL.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0}
function initDrill(){
  POOL=BANK.flatMap(b=>b.q.map(q=>({t:b.t,q,look:b.look})));
  if(order.length!==POOL.length)shuffle();
  const draw=()=>{const it=POOL[order[pos]];$("#drill-theme").textContent=t(it.t);$("#drill-q").textContent=it.q;$("#drill-a").textContent=t(U.lookfor)+" "+t(it.look);$("#drill-a").hidden=true;$("#drill-show").hidden=false;$("#drill-count").textContent=U.dCount(pos+1,POOL.length)};
  draw();
  $("#drill-show").addEventListener("click",()=>{$("#drill-a").hidden=false;$("#drill-show").hidden=true});
  $("#drill-next").addEventListener("click",()=>{pos++;if(pos>=order.length)shuffle();draw()});
}

/* Évènements globaux */
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#/"]');
  if(a){e.preventDefault();go(a.getAttribute("href"));return}
  if(e.target.closest("#skip")){e.preventDefault();$("#contenu").focus();return}
  const l=e.target.closest("[data-lang]");
  if(l){lang=l.dataset.lang;try{localStorage.setItem("panel-lang",lang)}catch(x){}render(true);return}
  const s=e.target.closest("[data-scroll]");
  if(s){const el=document.getElementById(s.dataset.scroll);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}
});
addEventListener("hashchange",()=>{cur=location.hash;render(false)});
const back=$("#back");
addEventListener("scroll",()=>back.classList.toggle("on",scrollY>600),{passive:true});
back.addEventListener("click",()=>scrollTo({top:0}));
render(true);
</script>
</body>
</html>
